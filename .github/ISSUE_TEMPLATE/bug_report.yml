name: Bug report / Fehler melden
description: Report a reproducible problem in 00:17.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include receipts, Apple Account information or other personal data.
  - type: input
    id: version
    attributes:
      label: App version and build
      placeholder: 1.0 (1)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and iOS version
      placeholder: iPhone 16, iOS 26.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
